server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;

    location / {
        try_files $uri $uri/ =404;
        # Pas de cache agressif : les mises à jour sont visibles au rechargement
        add_header Cache-Control "no-cache";
    }
}
